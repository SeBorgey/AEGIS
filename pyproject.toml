[project]
name = "aegis"
version = "0.1.0"
description = ""
authors = [
    {name = "Sergey Malyshev",email = "malyshev.sa@phystech.edu"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asteval==1.0.7",
    "fastapi==0.115.8",
    "openai>=2.0.0",
    "pydantic==2.10.6",
    "PySide6==6.10.0",
    "pyvirtualdisplay==3.0",
    "pyautogui==0.9.54",
    "uvicorn==0.34.0",
    "pyinstaller>=6.19.0",
    "python3-pyatspi>=1.19.0",
    "numpy>=2.4.3",
    "tqdm>=4.67.3",
    "requests>=2.32.5",
    "httpx>=0.28.1",
    "pygobject>=3.56.1",
    "pillow>=10.0.0",
    "tool-suggest[autointent,local]",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
tool-suggest = { path = "../DeepPavlov/tool-suggest" }

